# Railway configuration
# Backend service name from previous deploy: "reliable-courage"
#
# Usage examples:
#   railway up --service reliable-courage
#   railway up --service streamlit-app

[services.reliable-courage]
# FastAPI backend
build = { builder = "DOCKERFILE", dockerfilePath = "python-backend/Dockerfile" }
deploy = { startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT" }

[services.streamlit-app]
# Standalone Streamlit dashboard
build = { builder = "DOCKERFILE", dockerfilePath = "streamlit-app/Dockerfile" }
deploy = { startCommand = "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true" }